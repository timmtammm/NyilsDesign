<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyils Design — Link in Bio</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tombol Tema -->
  <button id="themeBtn" class="theme" aria-label="Ganti tema">🌙</button>

  <main class="layout">
    <!-- Kolom Profil -->
    <section class="profile">
      <div id="avatar" class="avatar">N</div>
      <h1 id="brand">Nyils Design</h1>
      <p id="bio" class="bio">Desain logo, kemasan & konten sosmed untuk UMKM.</p>
      <ul id="socials" class="socials"></ul>
    </section>

    <!-- Kolom Konten -->
    <section>
      <p id="linksTitle" class="label">Link Saya</p>
      
      <div id="tabs" class="tabs" role="tablist"></div>
      <p id="count" class="count"></p>
      <ul id="links" class="links"></ul>

      <!-- Layanan -->
      <div id="layanan" class="block">
        <h2>Layanan & harga</h2>
        <div id="services" class="services"></div>
      </div>

      <!-- Portofolio -->
      <div id="portofolio" class="block">
        <h2>Portofolio</h2>
        <div id="portfolio" class="grid"></div>
      </div>

      <!-- Form Pesan -->
      <div id="pesan" class="block">
        <h2>Pesan sekarang</h2>
        <form id="orderForm" class="order" onsubmit="return false;">
          <label>
            Nama
            <input type="text" id="oName" placeholder="Nama kamu" required>
          </label>
          <label>
            Layanan
            <select id="oService"></select>
          </label>
          <label>
            Catatan
            <textarea id="oNote" rows="3" placeholder="Detail pesanan..."></textarea>
          </label>
          <button type="button" id="oSend" class="btn">Kirim ke WhatsApp</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="foot">
    <button id="shareBtn" class="share"></button>
    <p id="footer">© 2026 Nyils Design.</p>
  </footer>

  <!-- Notifikasi Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
